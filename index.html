<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Stargazing</title>
<!--
  Stargazing intro — 山顶看星星的开场动画（一层层出现）
  黑 → 星空浮出来、往后退一点 → 满天小星 → 两颗亮星依次亮起 → 山顶营地从下面浮上来 → 小人落下 → 标题、第一颗流星
  之后：星星闪、流星（右上 → 左下）、篝火跳、火星往上飘。点一下屏幕跳过开场；系统开了「减少动画」就不播。
  改样子看下面的 CONFIG；换营地图看 README。MIT License。
-->
<style>
:root{--ink:#F2F0EC;--muted:rgba(242,240,236,.55);--ease-out:cubic-bezier(.23,1,.32,1)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#030305;color:var(--ink);overflow:hidden;-webkit-tap-highlight-color:transparent;font-family:system-ui,sans-serif}
.sg-scene{position:fixed;inset:0}
/* 天：canvas 画的星空 */
#sgSky{position:absolute;inset:0;width:100%;height:100%;display:block;transition:opacity 1.4s ease,transform 2.6s var(--ease-out)}
body.intro #sgSky:not(.in){opacity:0;transform:scale(1.08)}
/* 会闪的小星、小亮点 */
.sg-stars{position:absolute;inset:0;pointer-events:none;transition:opacity 1.6s ease}
body.intro .sg-stars:not(.in){opacity:0}
.sg-tw{position:absolute;fill:#fff;animation:sgTw var(--d,4s) ease-in-out infinite;animation-delay:var(--dl,0s)}
.sg-dot{position:absolute;border-radius:50%;background:#fff;animation:sgTw var(--d,4s) ease-in-out infinite;animation-delay:var(--dl,0s)}
@keyframes sgTw{0%,100%{opacity:.2;transform:scale(.7)}50%{opacity:.9;transform:scale(1)}}
/* 两颗亮星：canvas 画的十字星芒，开场依次亮起，之后慢慢呼吸 */
.sg-bright{position:absolute;pointer-events:none;animation:sgPulse 5s ease-in-out infinite}
body.intro .sg-bright:not(.lit){opacity:0;animation:none}
.sg-bright.lit{animation:sgLight .9s var(--ease-out),sgPulse 5s ease-in-out .9s infinite}
@keyframes sgLight{0%{opacity:0;transform:scale(.3)}45%{opacity:1;transform:scale(1.45)}100%{opacity:.85;transform:scale(1)}}
@keyframes sgPulse{0%,100%{opacity:.7;transform:scale(.96)}50%{opacity:.95;transform:scale(1.02)}}
.sg-meteor{position:absolute;height:1.5px;border-radius:1px;pointer-events:none;opacity:0;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.9));transform-origin:100% 50%}
/* 地：营地图贴底，在手机上现场画成像素图（每格整数个物理像素，不糊）；画好了才从下面浮上来 */
.sg-land{position:absolute;bottom:0;opacity:0;transform:translateY(28px);transition:opacity .7s ease,transform 1.1s var(--ease-out)}
.sg-land.ready{opacity:1;transform:none}
#sgGround{position:absolute;inset:0;width:100%;height:100%}
/* 篝火：从画好的地面上把火那一块复制出来，几帧之间往上拉长、左右晃、亮度起伏 */
.sg-flame{position:absolute;pointer-events:none;transform-origin:50% 100%;animation:sgFlick 1.2s steps(1) infinite}
@keyframes sgFlick{0%{transform:none;filter:none}20%{transform:scale(1.02,1.1);filter:brightness(1.12)}40%{transform:translateX(-1.5%) scale(.98,1.04);filter:brightness(.95)}60%{transform:scale(1.03,1.14) translateX(1.5%);filter:brightness(1.18)}80%{transform:scale(.99,.97);filter:brightness(.9)}}
.sg-spark{position:absolute;width:2px;height:2px;background:#FFC24A;pointer-events:none;opacity:0;animation:sgSpark var(--d,1.8s) steps(8) infinite;animation-delay:var(--dl,0s)}
@keyframes sgSpark{0%{opacity:0;transform:translate(0,0)}15%{opacity:1}100%{opacity:0;transform:translate(var(--x,4px),-34px)}}
/* 小人（可选）：落到地上，弹一下，之后轻轻晃 */
.sg-sprites{position:absolute;display:flex;align-items:flex-end;gap:6px;pointer-events:none;transition:opacity .25s ease,transform .5s cubic-bezier(.34,1.56,.64,1)}
body.intro .sg-sprites:not(.in){opacity:0;transform:translateY(-14px)}
.sg-sprites img{display:block;image-rendering:pixelated;animation:sgBob 1.6s steps(2) infinite}
.sg-sprites img:nth-child(2n){animation-delay:.8s}
@keyframes sgBob{50%{transform:translateY(-2px)}}
/* 标题 */
.sg-head{position:fixed;left:0;right:0;top:0;z-index:5;padding:calc(env(safe-area-inset-top) + 18px) 16px 0;text-align:center;pointer-events:none;transition:opacity .6s ease}
body.intro .sg-head:not(.in){opacity:0}
.sg-head h1{font-family:"Playfair Display",Georgia,serif;font-style:italic;font-weight:500;font-size:22px;letter-spacing:.01em}
.sg-head small{display:block;margin-top:2px;font-size:10.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted)}
@media (prefers-reduced-motion: reduce){.sg-tw,.sg-dot,.sg-bright,.sg-sprites img,.sg-spark,.sg-flame{animation:none!important}}
</style>
</head>
<body class="intro">
<div class="sg-scene" id="sgScene">
  <canvas id="sgSky" aria-hidden="true"></canvas>
  <div class="sg-stars" id="sgStars" aria-hidden="true"></div>
  <div class="sg-land" id="sgLand">
    <canvas id="sgGround" aria-hidden="true"></canvas>
    <canvas class="sg-flame" id="sgFlame" aria-hidden="true"></canvas>
    <div class="sg-sprites" id="sgSprites"></div>
  </div>
</div>
<header class="sg-head" id="sgHead"><h1>Stargazing</h1><small>tonight</small></header>
<script>
// ════════ CONFIG：改这里就行 ════════
const CONFIG = {
  ground: {
    src: 'assets/camp.webp',           // 营地图：透明天空的 PNG / WebP，贴着屏幕底边
    width: 1024, height: 616,          // 图的原始尺寸
    scale: 1.09, offsetX: -0.054,      // 显示宽度 = 屏幕宽 × scale；左边挪多少（按屏幕宽的比例，负数往左）
    cellCss: 1.34,                     // 一个像素格多宽（CSS 像素，按设备像素取整）；越大越「像素风」
    fire: { x: 0.3828, y: 0.2468, w: 0.0781, h: 0.1753 },   // 火在图里的位置（占图宽 / 图高的比例）；没火就设成 null
    sparks: { x: 0.41, y: 0.24, n: 6 },                       // 火星从哪儿往上飘；不要就 n: 0
  },
  // 小人（可选）：放在地上的哪儿（占图的比例，bottom = 脚离图底边多高），每个是一张像素图
  sprites: { x: 0.495, bottom: 0.505, list: [
    // { src: 'assets/me.png', w: 35, h: 22 },
    // { src: 'assets/you.png', w: 31, h: 22 },
  ] },
  sky: { stars: 1 / 1300, milkyWay: 1 / 160, twinkles: 32, dots: 70 },   // 星的密度（每多少平方像素一颗）、会闪的星数
  bright: [ { x: 0.30, y: 0.24, size: 50, tint: '255,246,230' }, { x: 0.66, y: 0.33, size: 42, tint: '255,214,226' } ],   // 两颗亮星
  meteor: { every: [3000, 8000], pairChance: 0.25 },   // 流星隔多久一颗（毫秒，范围里随机）、两颗前后脚的概率（开场第一颗跟标题一起出来）
  // 开场时间线（毫秒）
  intro: { sky: 30, stars: 350, land: 700, bright: [950, 1350], sprites: 1700, title: 2100, end: 2600 },
};
// ════════════════════════════════════

(function () {
  const $ = (id) => document.getElementById(id), B = document.body, C = CONFIG;
  let seed = 7; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
  const STAR = 'M12 1Q13.43 10.57 23 12Q13.43 13.43 12 23Q10.57 13.43 1 12Q10.57 10.57 12 1Z';

  // ── 天：散星 + 一条斜着的银河（全是小点堆出来） ──
  function drawSky() {
    const cv = $('sgSky'), W = innerWidth, H = innerHeight, d = Math.min(3, devicePixelRatio || 1), c = cv.getContext('2d');
    cv.width = Math.round(W * d); cv.height = Math.round(H * d); c.setTransform(d, 0, 0, d, 0, 0);
    c.fillStyle = '#030305'; c.fillRect(0, 0, W, H); c.fillStyle = '#fff'; seed = 7;
    const dot = (x, y, r, a) => { c.globalAlpha = a; c.beginPath(); c.arc(x, y, r, 0, 6.2832); c.fill(); };
    for (let i = 0, n = Math.round(W * H * C.sky.stars); i < n; i++) dot(rnd() * W, rnd() * H, .35 + rnd() * rnd() * 1.1, .25 + rnd() * .6);
    const ax = W * 1.1, ay = H * .05, bx = -W * .1, by = H * .8, len = Math.hypot(bx - ax, by - ay), ux = (bx - ax) / len, uy = (by - ay) / len;
    for (let i = 0, n = Math.round(W * H * C.sky.milkyWay); i < n; i++) {
      const t = rnd() * len, g = (rnd() + rnd() + rnd() - 1.5) / 1.5, off = g * W * .2;
      dot(ax + ux * t - uy * off, ay + uy * t + ux * off, .25 + rnd() * .5, (.08 + rnd() * .3) * (1 - Math.abs(g) * .7));
    }
    c.globalAlpha = 1;
  }

  // ── 会闪的小星、小亮点 ──
  for (let i = 0; i < C.sky.twinkles; i++) {
    const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg'), r = 4 + rnd() * 6;
    s.setAttribute('viewBox', '0 0 24 24'); s.setAttribute('class', 'sg-tw');
    s.style.cssText = 'left:' + (rnd() * 96).toFixed(1) + '%;top:' + (9 + rnd() * 52).toFixed(1) + '%;width:' + r.toFixed(1) + 'px;height:' + r.toFixed(1) + 'px;--d:' + (3 + rnd() * 4).toFixed(1) + 's;--dl:-' + (rnd() * 4).toFixed(1) + 's';
    s.innerHTML = '<path d="' + STAR + '"/>'; $('sgStars').appendChild(s);
  }
  for (let i = 0; i < C.sky.dots; i++) {
    const e = document.createElement('i'), r = 1 + rnd() * 1.6; e.className = 'sg-dot';
    e.style.cssText = 'left:' + (rnd() * 100).toFixed(1) + '%;top:' + (4 + rnd() * 66).toFixed(1) + '%;width:' + r.toFixed(1) + 'px;height:' + r.toFixed(1) + 'px;--d:' + (2.5 + rnd() * 4).toFixed(1) + 's;--dl:-' + (rnd() * 5).toFixed(1) + 's';
    $('sgStars').appendChild(e);
  }

  // ── 两颗亮星：canvas 画，中心亮点 + 一圈柔光 + 十字星芒 ──
  const brights = C.bright.map((b) => {
    const cv = document.createElement('canvas'), d = Math.min(3, devicePixelRatio || 1), S = b.size, c = cv.getContext('2d');
    cv.width = cv.height = Math.round(S * d); cv.className = 'sg-bright';
    cv.style.cssText = 'left:' + b.x * 100 + '%;top:' + b.y * 100 + '%;width:' + S + 'px;height:' + S + 'px;margin:' + (-S / 2) + 'px 0 0 ' + (-S / 2) + 'px';
    c.scale(d, d); const m = S / 2, col = (a) => 'rgba(' + b.tint + ',' + a + ')';
    const g = c.createRadialGradient(m, m, 0, m, m, m * .5); g.addColorStop(0, col(.9)); g.addColorStop(.25, col(.35)); g.addColorStop(1, col(0));
    c.fillStyle = g; c.fillRect(0, 0, S, S);
    for (const [w, h] of [[S, 1.2], [1.2, S]]) { const l = c.createLinearGradient(m - w / 2, m - h / 2, m + w / 2, m + h / 2); l.addColorStop(0, col(0)); l.addColorStop(.5, col(.95)); l.addColorStop(1, col(0)); c.fillStyle = l; c.fillRect(m - w / 2, m - h / 2, w, h); }
    c.fillStyle = '#fff'; c.beginPath(); c.arc(m, m, S * .045, 0, 6.2832); c.fill();
    $('sgScene').insertBefore(cv, $('sgLand')); return cv;
  });

  // ── 地：按宽铺、贴底；在手机上现场画成像素图 ──
  const G = C.ground, land = $('sgLand');
  land.style.cssText = 'left:' + G.offsetX * 100 + '%;width:' + G.scale * 100 + '%;aspect-ratio:' + G.width + '/' + G.height;
  if (G.fire) { const f = $('sgFlame').style; f.left = G.fire.x * 100 + '%'; f.top = G.fire.y * 100 + '%'; f.width = G.fire.w * 100 + '%'; f.height = G.fire.h * 100 + '%'; } else $('sgFlame').remove();
  for (let i = 0; i < G.sparks.n; i++) {
    const e = document.createElement('i'); e.className = 'sg-spark';
    e.style.cssText = 'left:' + ((G.sparks.x + rnd() * .03) * 100).toFixed(1) + '%;top:' + G.sparks.y * 100 + '%;--d:' + (1.4 + rnd()).toFixed(2) + 's;--dl:-' + (rnd() * 2).toFixed(2) + 's;--x:' + Math.round(rnd() * 10 - 5) + 'px';
    land.appendChild(e);
  }
  const sp = $('sgSprites'); sp.style.left = C.sprites.x * 100 + '%'; sp.style.bottom = C.sprites.bottom * 100 + '%';
  for (const s of C.sprites.list) { const im = new Image(); im.src = s.src; im.width = s.w; im.height = s.h; im.alt = ''; sp.appendChild(im); }

  let painted = false, landAt = Infinity;
  const src = new Image(); src.src = G.src;
  function paintLand() {
    if (!src.complete || !src.naturalWidth) return;
    const cv = $('sgGround'), d = devicePixelRatio || 1, W = land.clientWidth, H = land.clientHeight;
    const cell = Math.max(2, Math.round(d * G.cellCss)), dw = Math.round(W * d), dh = Math.round(H * d), cols = Math.ceil(dw / cell), rows = Math.ceil(dh / cell);
    const sm = document.createElement('canvas'); sm.width = cols; sm.height = rows;
    const sx = sm.getContext('2d'); sx.imageSmoothingEnabled = false; sx.drawImage(src, 0, 0, cols, rows);
    cv.width = dw; cv.height = dh;
    const c = cv.getContext('2d'); c.imageSmoothingEnabled = false; c.drawImage(sm, 0, 0, cols * cell, rows * cell);
    const fl = $('sgFlame');
    if (fl && G.fire) { fl.width = Math.round(dw * G.fire.w); fl.height = Math.round(dh * G.fire.h); const f = fl.getContext('2d'); f.imageSmoothingEnabled = false; f.drawImage(cv, Math.round(dw * G.fire.x), Math.round(dh * G.fire.y), fl.width, fl.height, 0, 0, fl.width, fl.height); }
    painted = true; if (performance.now() >= landAt) land.classList.add('ready');
  }
  src.onload = paintLand; if (src.complete) paintLand();
  drawSky();
  addEventListener('resize', () => { drawSky(); paintLand(); });

  // ── 流星：右上 → 左下，头在前 ──
  function shoot(delay) {
    const m = document.createElement('i'); m.className = 'sg-meteor'; $('sgScene').insertBefore(m, $('sgLand'));
    const ang = 140 + Math.random() * 25, len = 160 + Math.random() * 160;
    m.style.width = 80 + Math.random() * 80 + 'px'; m.style.left = innerWidth * (.2 + Math.random() * .8) + 'px'; m.style.top = innerHeight * (.04 + Math.random() * .4) + 'px';
    m.animate([{ transform: 'rotate(' + ang + 'deg) translateX(0)', opacity: 0 }, { opacity: 1, offset: .2 }, { transform: 'rotate(' + ang + 'deg) translateX(' + len + 'px)', opacity: 0 }], { duration: 700 + Math.random() * 500, delay, easing: 'cubic-bezier(.3,.6,.5,1)' }).onfinish = () => m.remove();
  }
  function meteor() {
    shoot(0); if (Math.random() < C.meteor.pairChance) shoot(250 + Math.random() * 400);
    setTimeout(meteor, C.meteor.every[0] + Math.random() * (C.meteor.every[1] - C.meteor.every[0]));
  }

  // ── 开场：按时间一层层亮出来；中途点一下跳到结尾；「减少动画」就不播 ──
  const T = C.intro, timers = [], at = (ms, fn) => timers.push(setTimeout(fn, ms));
  let done = false;
  function finish() {
    if (done) return; done = true; timers.forEach(clearTimeout);
    $('sgSky').classList.add('in'); $('sgStars').classList.add('in'); brights.forEach((b) => b.classList.add('lit')); sp.classList.add('in'); $('sgHead').classList.add('in');
    landAt = 0; if (painted) land.classList.add('ready');
    B.classList.remove('intro');
    setTimeout(meteor, 1200);
  }
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) finish();
  else {
    at(T.sky, () => $('sgSky').classList.add('in'));
    at(T.stars, () => $('sgStars').classList.add('in'));
    at(T.land, () => { landAt = 0; if (painted) land.classList.add('ready'); });
    T.bright.forEach((ms, i) => brights[i] && at(ms, () => brights[i].classList.add('lit')));
    at(T.sprites, () => sp.classList.add('in'));
    at(T.title, () => { $('sgHead').classList.add('in'); shoot(0); });
    at(T.end, finish);
    document.addEventListener('click', (e) => { if (!done) { e.stopPropagation(); finish(); } }, true);
  }
})();
</script>
</body>
</html>
